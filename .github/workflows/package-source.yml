name: Package AgentChat Source

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/package-source.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create tracked-source archive
        run: git archive --format=zip --prefix=AgentChat/ HEAD -o AgentChat-source-master.zip

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: AgentChat-source-master
          path: AgentChat-source-master.zip
          if-no-files-found: error
          retention-days: 7
