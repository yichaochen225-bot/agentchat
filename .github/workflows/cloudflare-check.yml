name: Cloudflare Check

on:
  pull_request:
    paths:
      - "cloudflare/**"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/cloudflare-check.yml"
  push:
    branches:
      - agentchat-cloud
    paths:
      - "cloudflare/**"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/cloudflare-check.yml"

jobs:
  root-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run cloud:check

  nested-dry-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
