name: Cloudflare Check

on:
  pull_request:
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-check.yml"
  push:
    branches:
      - agentchat-cloud
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-check.yml"

jobs:
  dry-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cloudflare/package.json
      - run: npm install
      - run: npm run check
