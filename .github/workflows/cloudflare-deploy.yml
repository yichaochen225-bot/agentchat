name: Deploy AgentChat Cloud

on:
  push:
    branches:
      - master
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentchat-cloud-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloudflare
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run syntax checks and tests
        run: |
          node --check src/index.js
          node --check src/mcp.js
          node --check src/providers.js
          node --check src/runner.js
          node --check public/app.js
          node --check public/pwa.js
          node --check public/sw.js
          npm test

      - name: Deploy to production traffic
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}

      - name: Cloudflare authorization not configured
        if: env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == ''
        run: |
          echo "Code and tests passed. Production deploy was skipped because GitHub Actions Cloudflare credentials are not configured."
          echo "Use Cloudflare Workers Builds / Deploy to Cloudflare, or add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
