<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080a0f">
<title>AgentChat · 免费访客模式</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app-shell">
<header class="topbar"><div><div class="eyebrow">GUEST WEB MODE</div><h1>AgentChat</h1></div><button id="settingsButton" class="icon-button" type="button">⚙</button></header>
<main>
<section class="hero-card"><div><div class="status-row"><span class="dot good"></span><span>免费访客模式 · 不使用 AI API</span></div><h2>一次询问多个 AI</h2><p>通过官方网页访客功能发送问题并读取回答。不会保存 AI 登录密码、验证码或登录态。</p></div></section>
<section class="composer-card">
<div class="composer-heading"><div><div class="eyebrow">PROMPT</div><h2>输入问题</h2></div><span id="promptCount" class="prompt-count">0 / 12000</span></div>
<textarea id="promptInput" maxlength="12000" placeholder="例如：请分析今天 ETH 的走势"></textarea>
<div class="mode-row"><select id="providerSelect"><option value="auto">自动访客：依次尝试</option></select><button id="askButton" class="primary-button" type="button">询问</button></div>
<button id="askAllButton" class="secondary-button full" type="button">依次询问全部访客 AI</button>
</section>
<section class="section-block"><div class="section-head"><div><div class="eyebrow">RESULTS</div><h3>AI 回答</h3></div><span id="runStatus" class="muted">等待问题</span></div><div id="results" class="results"></div></section>
<section class="section-block"><div class="section-head"><div><div class="eyebrow">LOCAL HISTORY</div><h3>本机历史</h3></div><button id="clearHistoryButton" class="text-button" type="button">清除</button></div><div id="historyList" class="history-list"></div></section>
</main>
<nav class="bottom-nav"><button class="nav-item active" type="button" data-target=".composer-card">询问</button><button class="nav-item" type="button" data-target=".section-block">结果</button></nav>
</div>
<dialog id="settingsDialog"><form method="dialog" class="dialog-card"><div class="section-head"><h3>连接设置</h3><button class="icon-button" type="submit">×</button></div><p class="muted">输入你在 Cloudflare Secret 中设置的 AgentChat 访问令牌。它只保存在当前手机会话，不是任何 AI 密码。</p><input id="tokenInput" type="password" autocomplete="off" placeholder="AgentChat 访问令牌"><button id="saveTokenButton" class="primary-button full" type="button">保存并验证</button></form></dialog>
<div id="toast" class="toast" role="status"></div>
<script type="module" src="/app.js"></script>
</body></html>
